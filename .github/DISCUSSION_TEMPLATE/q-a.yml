title: "Question: [Short Summary]"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for starting a discussion!
        Please fill out the template below to help the community understand and answer your question.
  - type: textarea
    id: question-details
    attributes:
      label: "What is your question?"
      description: "Provide a clear and concise description of what you are trying to achieve or what you are struggling with."
      placeholder: "I want to configure flycomp to..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "What have you tried so far?"
      description: "Describe any solutions, workarounds, commands, or resources you have already looked at or tried."
      placeholder: "I tried running cargo run -- but..."
  - type: input
    id: environment
    attributes:
      label: "Environment Information"
      description: "e.g. OS, shell (bash/zsh/fish), flycomp version, Rust version"
      placeholder: "Linux, bash v5.2, flycomp v1.1.1"
  - type: checkboxes
    id: checklist
    attributes:
      label: "Before submitting"
      options:
        - label: "I have searched existing discussions and issues for similar questions."
          required: true
        - label: "I have checked the documentation / README."
          required: true
